<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description"
    content="Interactive IT Passport (ITPEC/IPA) exam reviewer. Click answers, get instant AI explanations, track your progress.">
  <title>IT Passport Reviewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens — Light mode (default) ── */
    :root {
      --bg: #f4f5f9;
      --surface: #fff;
      --card: #fff;
      --card-h: #f0f2f8;
      --bd: #dde1ee;
      --bd-b: #b8bfda;
      --tx: #1a1d2e;
      --mut: #555c7a;
      --dim: #8890b0;
      --pri: #4a60e8;
      --pri-glow: rgba(74, 96, 232, .12);
      --ok: #1d8a42;
      --ok-bg: rgba(29, 138, 66, .09);
      --ok-bd: rgba(29, 138, 66, .3);
      --warn: #c27803;
      --warn-bg: rgba(194, 120, 3, .1);
      --warn-bd: rgba(194, 120, 3, .3);
      --bad: #c0192d;
      --bad-bg: rgba(192, 25, 45, .08);
      --bad-bd: rgba(192, 25, 45, .28);
      --accent: #6d3fc9;
      --r: 16px;
      --rs: 10px;
      --rp: 99px;
      --shadow: 0 4px 24px rgba(0, 0, 0, .08);
      --shadow-s: 0 1px 6px rgba(0, 0, 0, .07);
      --font: 'Inter', system-ui, sans-serif;
      --t: .18s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── Dark mode ── */
    [data-dark] {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #1e2130;
      --card-h: #252840;
      --bd: #2d3148;
      --bd-b: #3d4268;
      --tx: #e8eaf4;
      --mut: #9198bc;
      --dim: #4a5080;
      --pri: #6c7fff;
      --pri-glow: rgba(108, 127, 255, .18);
      --ok: #3ecf72;
      --ok-bg: rgba(62, 207, 114, .1);
      --ok-bd: rgba(62, 207, 114, .35);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, .12);
      --warn-bd: rgba(245, 158, 11, .35);
      --bad: #ff6b8a;
      --bad-bg: rgba(255, 107, 138, .1);
      --bad-bd: rgba(255, 107, 138, .35);
      --accent: #a78bfa;
      --shadow: 0 8px 32px rgba(0, 0, 0, .4);
      --shadow-s: 0 2px 8px rgba(0, 0, 0, .25);
    }

    /* ── Reset ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--tx);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 20% -10%, rgba(74, 96, 232, .06) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 80% 110%, rgba(109, 63, 201, .04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0
    }

    [data-dark] body::before {
      background: radial-gradient(ellipse 80% 60% at 20% -10%, rgba(108, 127, 255, .12) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 80% 110%, rgba(167, 139, 250, .08) 0%, transparent 60%)
    }

    /* ── Top Nav ── */
    .top-nav {
      position: fixed;
      top: 12px;
      left: 0;
      right: 0;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 90;
      pointer-events: none;
      transition: max-width var(--t);
    }

    .top-nav.exam-nav {
      max-width: 1080px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--rp);
      padding: 7px 13px;
      font-size: .82rem;
      font-weight: 600;
      color: var(--mut);
      box-shadow: var(--shadow-s);
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background var(--t), color var(--t), border-color var(--t), transform var(--t);
    }

    .nav-pill:hover {
      background: var(--card-h);
      color: var(--tx);
      border-color: var(--bd-b);
      transform: translateY(-1px);
    }

    .nav-pill .dot-active {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    /* ── Layout ── */
    #app {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 68px 16px 80px;
      transition: max-width var(--t);
    }

    #app.exam-mode {
      max-width: 1080px;
    }

    /* ── Exam 2-Column Grid (Desktop) ── */
    .exam-container {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 24px;
      align-items: start;
    }

    .exam-main {
      min-width: 0;
    }

    /* ── Live Progress Dashboard (Sidebar) ── */
    .exam-sidebar {
      position: sticky;
      top: 68px;
      max-height: calc(100vh - 84px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 4px;
    }

    .exam-sidebar::-webkit-scrollbar {
      width: 5px;
    }

    .exam-sidebar::-webkit-scrollbar-thumb {
      background: var(--bd);
      border-radius: 4px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .sidebar-title {
      font-size: .88rem;
      font-weight: 700;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .mobile-close-btn {
      display: none;
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: var(--mut);
      cursor: pointer;
      padding: 4px 8px;
      box-shadow: none;
    }

    /* ── Dashboard Cards ── */
    .dash-card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      padding: 16px;
      box-shadow: var(--shadow-s);
    }

    /* ── Pass/Fail Prediction Card ── */
    .pred-card {
      border: 1.5px solid var(--bd);
      transition: border-color var(--t), background var(--t);
    }

    .pred-card.passing {
      border-color: var(--ok-bd);
      background: linear-gradient(145deg, var(--ok-bg), var(--card));
    }

    .pred-card.warning {
      border-color: var(--warn-bd);
      background: linear-gradient(145deg, var(--warn-bg), var(--card));
    }

    .pred-card.failing {
      border-color: var(--bad-bd);
      background: linear-gradient(145deg, var(--bad-bg), var(--card));
    }

    .pred-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .88rem;
      font-weight: 800;
      letter-spacing: .02em;
      margin-bottom: 6px;
    }

    .pred-status.ok {
      color: var(--ok);
    }

    .pred-status.warn {
      color: var(--warn);
    }

    .pred-status.bad {
      color: var(--bad);
    }

    .pred-score {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 4px;
    }

    .pred-desc {
      font-size: .8rem;
      color: var(--mut);
      line-height: 1.45;
    }

    /* ── Stats Grid ── */
    .stats-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: var(--rs);
      padding: 8px 6px;
      text-align: center;
    }

    .stat-pill.ok {
      border-color: var(--ok-bd);
    }

    .stat-pill.bad {
      border-color: var(--bad-bd);
    }

    .stat-pill .s-num {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .stat-pill.ok .s-num {
      color: var(--ok);
    }

    .stat-pill.bad .s-num {
      color: var(--bad);
    }

    .stat-pill .s-lbl {
      font-size: .68rem;
      font-weight: 600;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* ── Wrong Questions List ── */
    .wrong-list-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      max-height: 110px;
      overflow-y: auto;
    }

    .chip.clickable {
      cursor: pointer;
      transition: transform var(--t);
    }

    .chip.clickable:hover {
      transform: scale(1.08);
    }

    /* ── 100-Question Grid Map ── */
    .q-grid-wrap {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-top: 10px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .q-tile {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: 1px solid var(--bd);
      background: var(--surface);
      font-size: .72rem;
      font-weight: 700;
      color: var(--mut);
      cursor: pointer;
      transition: transform var(--t), border-color var(--t), background var(--t);
      user-select: none;
    }

    .q-tile:hover {
      transform: scale(1.15);
      z-index: 2;
    }

    .q-tile.ok {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok);
    }

    .q-tile.bad {
      background: var(--bad);
      color: #fff;
      border-color: var(--bad);
    }

    .q-tile.current {
      border: 2px solid var(--pri);
      color: var(--pri);
      box-shadow: 0 0 8px var(--pri-glow);
      font-weight: 800;
    }

    .q-tile.current.ok {
      background: var(--ok);
      border-color: #fff;
      color: #fff;
    }

    .q-tile.current.bad {
      background: var(--bad);
      border-color: #fff;
      color: #fff;
    }

    .q-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: .73rem;
      color: var(--mut);
      margin-top: 8px;
    }

    .dot-legend {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 3px;
    }

    .dot-legend.ok {
      background: var(--ok);
    }

    .dot-legend.bad {
      background: var(--bad);
    }

    .dot-legend.cur {
      border: 2px solid var(--pri);
    }

    /* ── Mobile Drawer Backdrop ── */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(2px);
      z-index: 98;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t);
    }

    .sidebar-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Type ── */
    h1 {
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      font-weight: 800;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, var(--tx) 30%, var(--pri) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .25em
    }

    .subtitle {
      font-size: .9rem;
      color: var(--mut);
      margin-bottom: 1.5rem
    }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-s);
      transition: border-color var(--t), box-shadow var(--t);
      animation: fadeUp .3s ease both
    }

    .card:hover {
      border-color: var(--bd-b)
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* ── In-Progress Banner ── */
    .resume-card {
      border: 2px solid var(--pri);
      background: linear-gradient(to bottom, var(--surface), var(--card));
      box-shadow: 0 6px 20px var(--pri-glow);
    }

    .resume-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--pri-glow);
      color: var(--pri);
      font-weight: 700;
      font-size: .78rem;
      padding: 3px 10px;
      border-radius: var(--rp);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: var(--rp);
      font-size: .78rem;
      font-weight: 600;
      background: var(--surface);
      color: var(--mut);
      border: 1px solid var(--bd);
    }

    .badge.ok {
      background: var(--ok-bg);
      color: var(--ok);
      border-color: var(--ok-bd);
    }

    .badge.bad {
      background: var(--bad-bg);
      color: var(--bad);
      border-color: var(--bad-bd);
    }

    .badge.cached {
      background: rgba(74, 96, 232, .1);
      color: var(--pri);
      border-color: rgba(74, 96, 232, .25);
    }

    /* ── Buttons ── */
    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: var(--rs);
      border: 1px solid var(--bd);
      background: var(--surface);
      color: var(--tx);
      font: 600 .9rem var(--font);
      cursor: pointer;
      box-shadow: var(--shadow-s);
      transition: background var(--t), border-color var(--t), transform var(--t), box-shadow var(--t);
      user-select: none;
      -webkit-user-select: none;
    }

    button:hover:not(:disabled) {
      background: var(--card-h);
      border-color: var(--bd-b);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    button.pri {
      background: var(--pri);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 2px 10px var(--pri-glow);
    }

    button.pri:hover:not(:disabled) {
      background: #394fd4;
      box-shadow: 0 4px 16px var(--pri-glow);
    }

    [data-dark] button.pri:hover:not(:disabled) {
      background: #5b6fff;
    }

    button.ghost {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      color: var(--mut);
    }

    button.ghost:hover:not(:disabled) {
      background: var(--card-h);
      color: var(--tx);
    }

    button.sm {
      padding: 6px 12px;
      font-size: .8rem;
      border-radius: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ── Progress bar ── */
    .prog-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: .83rem;
      font-weight: 600;
      color: var(--mut);
    }

    .bar {
      height: 7px;
      background: var(--bd);
      border-radius: var(--rp);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--pri), var(--accent));
      border-radius: var(--rp);
      transition: width .35s ease;
    }

    /* ── Question & Options ── */
    .q-num {
      font-size: .78rem;
      font-weight: 700;
      color: var(--pri);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }

    .stem {
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.65;
      margin-bottom: 18px;
      white-space: pre-wrap;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      border-radius: var(--rs);
      border: 1.5px solid var(--bd);
      background: var(--surface);
      color: var(--tx);
      font: 500 .93rem/1.55 var(--font);
      margin-bottom: 9px;
      cursor: pointer;
      box-shadow: none;
      transition: background var(--t), border-color var(--t), transform var(--t);
    }

    .opt:hover:not(:disabled) {
      border-color: var(--pri);
      background: var(--pri-glow);
      transform: translateX(2px);
    }

    .opt .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--card-h);
      border: 1px solid var(--bd);
      font-weight: 700;
      font-size: .78rem;
      color: var(--mut);
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .opt.ok {
      border-color: var(--ok);
      background: var(--ok-bg);
      color: var(--tx);
      opacity: 1 !important;
    }

    .opt.ok .key {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok);
    }

    .opt.bad {
      border-color: var(--bad);
      background: var(--bad-bg);
      color: var(--tx);
      opacity: 1 !important;
    }

    .opt.bad .key {
      background: var(--bad);
      color: #fff;
      border-color: var(--bad);
    }

    .opt.neutral {
      opacity: .75;
    }

    /* ── Exam figure / page ── */
    img.pg {
      width: 100%;
      border-radius: var(--rs);
      border: 1px solid var(--bd);
      margin: 12px 0;
      display: block;
      box-shadow: var(--shadow-s);
    }

    /* ── Explanation Area ── */
    .exp-wrap {
      margin-top: 18px;
      animation: fadeUp .25s ease both;
    }

    .result-tag {
      font-weight: 700;
      font-size: .95rem;
      padding: 9px 14px;
      border-radius: var(--rs);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-tag.ok {
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid var(--ok-bd);
    }

    .result-tag.bad {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-bd);
    }

    .exp-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .exp {
      background: var(--surface);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 18px 20px;
      font-size: .98rem;
      line-height: 1.8;
      box-shadow: var(--shadow-s);
    }

    .exp h4 {
      margin: 14px 0 6px;
      font-size: 1rem;
      color: var(--pri);
      border-bottom: 1px solid var(--bd);
      padding-bottom: 4px;
    }

    .exp h4:first-child {
      margin-top: 0;
    }

    .exp p {
      margin: 0 0 8px;
    }

    .exp b {
      color: var(--tx);
      font-weight: 700;
    }

    .exp code {
      background: var(--card-h);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: .9em;
      border: 1px solid var(--bd);
    }

    .exp-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--dim);
      font-size: .88rem;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: var(--rs);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--bd);
      border-top-color: var(--pri);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .api-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .82rem;
      color: var(--bad);
      padding: 10px 14px;
      background: var(--bad-bg);
      border: 1px solid var(--bad-bd);
      border-radius: var(--rs);
      margin-top: 10px;
    }

    /* ── Score / Finish ── */
    .score-card {
      text-align: center;
      padding: 36px 20px;
    }

    .score-emoji {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .score-num {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .score-num .slash {
      color: var(--dim);
      font-weight: 400;
    }

    .score-pct {
      font-size: 1.1rem;
      color: var(--mut);
      font-weight: 600;
      margin: 6px 0 20px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 20px;
      justify-content: center;
    }

    .chip {
      padding: 3px 10px;
      border-radius: var(--rp);
      font-size: .78rem;
      font-weight: 700;
    }

    .chip.bad {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-bd);
    }

    /* ── History ── */
    .hist-score {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .hist-meta {
      font-size: .8rem;
      color: var(--mut);
      margin-top: 3px;
    }

    .hist-missed {
      font-size: .8rem;
      color: var(--bad);
      margin-top: 4px;
    }

    /* ── Modal (Session Key) ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn .2s ease;
    }

    .modal-card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      max-width: 440px;
      width: 100%;
      padding: 24px;
      animation: scaleUp .22s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes scaleUp {
      from {
        opacity: 0;
        transform: scale(.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--rs);
      border: 1.5px solid var(--bd);
      background: var(--surface);
      color: var(--tx);
      font: 600 1rem var(--font);
      outline: none;
      margin: 12px 0 16px;
      transition: border-color var(--t);
    }

    .input-box:focus {
      border-color: var(--pri);
      box-shadow: 0 0 0 3px var(--pri-glow);
    }

    .recent-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 16px;
    }

    .recent-chip {
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: var(--rp);
      padding: 4px 10px;
      font-size: .78rem;
      font-weight: 600;
      color: var(--mut);
      cursor: pointer;
      transition: background var(--t), color var(--t);
    }

    .recent-chip:hover {
      background: var(--card-h);
      color: var(--tx);
      border-color: var(--bd-b);
    }

    /* ── Misc ── */
    .home-logo {
      font-size: 2rem;
      margin-bottom: 6px;
    }

    hr.div {
      border: none;
      border-top: 1px solid var(--bd);
      margin: 20px 0;
    }

    .data-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 6px;
    }

    input[type=file] {
      display: none;
    }

    .file-label {
      cursor: pointer;
      padding: 9px 14px;
      border-radius: var(--rs);
      border: 1px solid var(--bd);
      background: var(--surface);
      color: var(--mut);
      font: 600 .88rem var(--font);
      transition: background var(--t), color var(--t);
    }

    .file-label:hover {
      background: var(--card-h);
      color: var(--tx);
    }

    .hint {
      font-size: .76rem;
      color: var(--dim);
      text-align: center;
      margin-top: 14px;
    }

    kbd {
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 5px;
      padding: 1px 5px;
      font-size: .72rem;
      font-family: monospace;
    }

    .next-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
      gap: 8px;
    }

    .exam-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .exam-meta {
      font-size: .82rem;
      color: var(--mut);
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .dot {
      color: var(--dim);
    }

    /* ── Responsive & Mobile Drawer ── */
    #mobile-stats-btn {
      display: none;
    }

    @media(max-width: 959px) {
      .exam-container {
        display: block;
      }

      #mobile-stats-btn {
        display: inline-flex;
      }

      .mobile-close-btn {
        display: block;
      }

      .exam-sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 330px;
        max-width: 86vw;
        max-height: 100vh;
        background: var(--card);
        z-index: 105;
        padding: 20px 16px 40px;
        box-shadow: -6px 0 28px rgba(0, 0, 0, .28);
        transform: translateX(105%);
        transition: transform .25s cubic-bezier(.4, 0, .2, 1);
      }

      .exam-sidebar.mobile-open {
        transform: translateX(0);
      }
    }

    @media(max-width:480px) {
      #app {
        padding: 60px 12px 72px;
      }

      .card {
        padding: 16px;
      }

      .opt {
        padding: 12px 13px;
      }

      .score-num {
        font-size: 2.8rem;
      }

      button {
        padding: 11px 14px;
      }

      button.pri {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <header id="top-nav" class="top-nav">
    <div class="nav-actions">
      <button id="session-btn" class="nav-pill" onclick="openSessionModal()" title="Manage Study Session">
        <span class="dot-active"></span>
        <span id="session-label">🔑 Session</span>
      </button>
      <button id="mobile-stats-btn" class="nav-pill" onclick="toggleSidebar(true)" title="View Progress Dashboard">
        📊 Stats
      </button>
    </div>
    <div class="nav-actions">
      <button id="theme-btn" class="nav-pill" onclick="toggleTheme()" title="Toggle light/dark mode">
        🌙 Dark
      </button>
    </div>
  </header>

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

  <main id="app">
    <div class="exp-loading" style="justify-content:center;min-height:50vh">
      <div class="spinner"></div>
      <span>Loading reviewer…</span>
    </div>
  </main>

  <!-- Session Key Modal Dialog -->
  <div id="session-modal" class="modal-backdrop" style="display:none">
    <div class="modal-card">
      <div style="font-size:1.8rem;margin-bottom:6px">🔑</div>
      <h2 style="font-size:1.25rem;font-weight:800;margin-bottom:6px">Study Session Key</h2>
      <p style="font-size:.86rem;color:var(--mut);line-height:1.5">
        Enter a memorable key (e.g. <b>danah-review</b> or your nickname). Whenever you return or restart, your exam
        position, answers, and AI explanations are restored!
      </p>

      <input type="text" id="session-input" class="input-box" placeholder="e.g. my-pass-2026"
        onkeydown="if(event.key==='Enter') saveSessionModal()">

      <div id="recent-sessions-wrap" style="display:none">
        <div style="font-size:.76rem;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em">Recent on this device:</div>
        <div id="recent-sessions" class="recent-chips"></div>
      </div>

      <div class="btn-row" style="margin-top:14px">
        <button class="pri" style="flex:1" onclick="saveSessionModal()">Start / Load Session</button>
        <button class="ghost" onclick="suggestRandomKey()" title="Generate a memorable random key">🎲 Suggest</button>
      </div>

      <div style="margin-top:12px;text-align:center">
        <button id="session-close-btn" class="ghost sm" onclick="closeSessionModal()" style="display:none">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // ── Global State ───────────────────────────────────────────────────────────
    const ACTIVE_KEY_STORE = 'itp_active_key';
    const RECENT_KEYS_STORE = 'itp_recent_keys';
    let EXAMS = [], S = null;
    let currentKey = localStorage.getItem(ACTIVE_KEY_STORE) || '';
    let sessionData = null; // { key, inProgress, exams: { [examId]: { attempts, missed, explS, expl2 } } }
    const MEM_CACHE = { short: {}, detailed: {} };

    const app = document.getElementById('app');
    const topNav = document.getElementById('top-nav');
    const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const fmt = t => new Date(t).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

    // ── One-time Migration from legacy itp_reviewer_v1 ─────────────────────────
    (function migrateLegacy() {
      try {
        const leg = JSON.parse(localStorage.getItem('itp_reviewer_v1'));
        if (leg && typeof leg === 'object') {
          for (const [examId, ex] of Object.entries(leg)) {
            if (ex.explS) {
              for (const [qn, txt] of Object.entries(ex.explS)) {
                if (txt && !localStorage.getItem(`itp_expl_short_${examId}_${qn}`)) {
                  localStorage.setItem(`itp_expl_short_${examId}_${qn}`, txt);
                }
              }
            }
            if (ex.expl2) {
              for (const [qn, txt] of Object.entries(ex.expl2)) {
                if (txt && !localStorage.getItem(`itp_expl_detailed_${examId}_${qn}`)) {
                  localStorage.setItem(`itp_expl_detailed_${examId}_${qn}`, txt);
                }
              }
            }
          }
        }
      } catch (_) { }
    })();

    // ── Session Storage System ────────────────────────────────────────────────
    function getSessionStorageKey(key) {
      return 'itp_session_' + encodeURIComponent(key.trim().toLowerCase());
    }

    function initSession(key) {
      const k = key.trim().toLowerCase();
      const storageKey = getSessionStorageKey(k);
      let data = null;
      try { data = JSON.parse(localStorage.getItem(storageKey)); } catch (_) { }
      if (!data) {
        data = { key: k, inProgress: null, exams: {} };
      }
      data.exams = data.exams || {};
      sessionData = data;
      currentKey = k;
      localStorage.setItem(ACTIVE_KEY_STORE, k);
      addRecentKey(k);
      updateSessionNav();
      syncFromCloud(k);
      return data;
    }

    function saveSessionData() {
      if (!sessionData || !currentKey) return;
      const storageKey = getSessionStorageKey(currentKey);
      try {
        localStorage.setItem(storageKey, JSON.stringify(sessionData));
      } catch (_) { }
      syncToCloud(currentKey, sessionData);
    }

    function examData(id) {
      if (!sessionData) initSession(currentKey || 'default');
      sessionData.exams = sessionData.exams || {};
      if (!sessionData.exams[id]) {
        sessionData.exams[id] = { attempts: [], missed: [], explS: {}, expl2: {} };
      }
      const ed = sessionData.exams[id];
      ed.attempts = ed.attempts || [];
      ed.missed = ed.missed || [];
      ed.explS = ed.explS || {};
      ed.expl2 = ed.expl2 || {};
      return ed;
    }

    function addRecentKey(k) {
      try {
        let recents = JSON.parse(localStorage.getItem(RECENT_KEYS_STORE)) || [];
        recents = [k, ...recents.filter(x => x !== k)].slice(0, 6);
        localStorage.setItem(RECENT_KEYS_STORE, JSON.stringify(recents));
      } catch (_) { }
    }

    function updateSessionNav() {
      const label = document.getElementById('session-label');
      if (label) {
        label.textContent = currentKey ? `🔑 ${currentKey}` : '🔑 Set Key';
      }
    }

    // ── Cloud Sync ────────────────────────────────────────────────────────────
    async function syncFromCloud(key) {
      try {
        const r = await fetch(`/api/session?key=${encodeURIComponent(key)}`);
        if (!r.ok) return;
        const res = await r.json();
        if (res.cloud && res.found && res.data) {
          sessionData = { ...sessionData, ...res.data };
          localStorage.setItem(getSessionStorageKey(key), JSON.stringify(sessionData));
          if (!S) home();
        }
      } catch (_) { }
    }

    async function syncToCloud(key, data) {
      try {
        fetch('/api/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, data })
        }).catch(() => { });
      } catch (_) { }
    }

    // ── AI Explanation Caching & Storage ──────────────────────────────────────
    function getCachedExpl(examId, qNum, mode) {
      const key = `${examId}_${qNum}`;
      if (MEM_CACHE[mode]?.[key]) return MEM_CACHE[mode][key];
      const globalTxt = localStorage.getItem(`itp_expl_${mode}_${key}`);
      if (globalTxt) {
        MEM_CACHE[mode][key] = globalTxt;
        return globalTxt;
      }
      const ed = examData(examId);
      const sessTxt = mode === 'detailed' ? ed.expl2?.[qNum] : ed.explS?.[qNum];
      if (sessTxt) {
        MEM_CACHE[mode][key] = sessTxt;
        return sessTxt;
      }
      return null;
    }

    function setCachedExpl(examId, qNum, mode, text) {
      if (!text) return;
      const key = `${examId}_${qNum}`;
      MEM_CACHE[mode][key] = text;
      try {
        localStorage.setItem(`itp_expl_${mode}_${key}`, text);
      } catch (_) { }
      const ed = examData(examId);
      if (mode === 'detailed') {
        ed.expl2[qNum] = text;
      } else {
        ed.explS[qNum] = text;
      }
      saveSessionData();
    }

    // ── Theme ──────────────────────────────────────────────────────────────────
    const THEME_KEY = 'itp_theme';
    function applyTheme() {
      const dark = localStorage.getItem(THEME_KEY) === 'dark';
      document.documentElement.toggleAttribute('data-dark', dark);
      const btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = dark ? '☀ Light' : '🌙 Dark';
    }
    function toggleTheme() {
      const isDark = document.documentElement.hasAttribute('data-dark');
      localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark');
      applyTheme();
    }
    applyTheme();

    // ── Sidebar Drawer Toggle (Mobile) ─────────────────────────────────────────
    function toggleSidebar(open) {
      const sb = document.getElementById('exam-sidebar');
      const bd = document.getElementById('sidebar-backdrop');
      if (!sb || !bd) return;
      if (open) {
        sb.classList.add('mobile-open');
        bd.classList.add('active');
      } else {
        sb.classList.remove('mobile-open');
        bd.classList.remove('active');
      }
    }

    // ── Session Key Modal Logic ────────────────────────────────────────────────
    function openSessionModal() {
      const modal = document.getElementById('session-modal');
      const input = document.getElementById('session-input');
      const closeBtn = document.getElementById('session-close-btn');
      const recentWrap = document.getElementById('recent-sessions-wrap');
      const recentContainer = document.getElementById('recent-sessions');

      input.value = currentKey || '';
      closeBtn.style.display = currentKey ? 'inline-block' : 'none';

      let recents = [];
      try { recents = JSON.parse(localStorage.getItem(RECENT_KEYS_STORE)) || []; } catch (_) { }
      if (recents.length > 0) {
        recentWrap.style.display = 'block';
        recentContainer.innerHTML = recents.map(k =>
          `<span class="recent-chip" onclick="selectRecentKey('${esc(k)}')">${esc(k)}</span>`
        ).join('');
      } else {
        recentWrap.style.display = 'none';
      }

      modal.style.display = 'flex';
      setTimeout(() => input.focus(), 50);
    }

    function closeSessionModal() {
      if (!currentKey) return;
      document.getElementById('session-modal').style.display = 'none';
    }

    function selectRecentKey(k) {
      document.getElementById('session-input').value = k;
      saveSessionModal();
    }

    function suggestRandomKey() {
      const adjectives = ['swift', 'sharp', 'bright', 'cyber', 'quiet', 'zen', 'smart', 'lucky', 'cool', 'alpha', 'nova'];
      const nouns = ['owl', 'falcon', 'tiger', 'ninja', 'phoenix', 'lynx', 'wolf', 'rocket', 'pilot', 'coder', 'seeker'];
      const num = Math.floor(Math.random() * 89 + 10);
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      document.getElementById('session-input').value = `${adj}-${noun}-${num}`;
    }

    function saveSessionModal() {
      const val = document.getElementById('session-input').value.trim();
      if (!val) {
        alert('Please enter a session key, or click "🎲 Suggest" to generate one.');
        return;
      }
      initSession(val);
      document.getElementById('session-modal').style.display = 'none';
      home();
    }

    // ── Load Questions ────────────────────────────────────────────────────────
    fetch('questions.json')
      .then(r => r.json())
      .then(d => {
        EXAMS = d.exams;
        if (!currentKey) {
          openSessionModal();
        } else {
          initSession(currentKey);
          home();
        }
      })
      .catch(() => {
        app.innerHTML = `<div class="card"><b>⚠ Could not load questions.json</b></div>`;
      });

    // ── Keyboard Shortcuts ─────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (document.getElementById('session-modal').style.display === 'flex') return;
      if (!S) return;
      const q = S.list[S.i], picked = S.answers[q.n], keys = Object.keys(q.options);
      if (picked == null) {
        const idx = 'abcd'.indexOf(e.key.toLowerCase());
        if (idx >= 0 && idx < keys.length) pick(keys[idx]);
      } else {
        if (e.key === 'Enter' || e.key === 'ArrowRight') next();
      }
    });

    // ── Home View ──────────────────────────────────────────────────────────────
    function home() {
      S = null;
      app.classList.remove('exam-mode');
      topNav.classList.remove('exam-nav');
      document.getElementById('mobile-stats-btn').style.display = 'none';
      toggleSidebar(false);

      if (!currentKey) {
        openSessionModal();
        return;
      }
      updateSessionNav();

      const inProg = sessionData?.inProgress;
      const inProgExam = inProg ? EXAMS.find(x => x.id === inProg.examId) : null;

      let inProgressHtml = '';
      if (inProg && inProgExam) {
        const totalQ = inProg.listLength || inProgExam.questions.length;
        const currentQNum = (inProg.i || 0) + 1;
        const answeredCount = Object.keys(inProg.answers || {}).length;
        const pct = Math.round((currentQNum / totalQ) * 100);

        inProgressHtml = `
      <div class="card resume-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <span class="resume-badge">⚡ In-Progress Exam</span>
            <div class="exam-title" style="margin-top:6px;font-size:1.05rem">${esc(inProgExam.title)}</div>
            <div class="exam-meta">
              <span>Question ${currentQNum} of ${totalQ}</span>
              <span class="dot">·</span>
              <span>${answeredCount} answered</span>
              <span class="dot">·</span>
              <span style="color:var(--ok);font-weight:600">Auto-saved to "${esc(currentKey)}"</span>
            </div>
          </div>
        </div>
        <div class="bar" style="margin:10px 0 16px"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="btn-row">
          <button class="pri" onclick="resumeExam()">▶ Resume Question ${currentQNum}</button>
          <button class="ghost sm" onclick="discardInProgress()">Start over</button>
        </div>
      </div>`;
      }

      app.innerHTML = `
    <div style="margin-bottom:24px">
      <div class="home-logo">📘</div>
      <h1>IT Passport Reviewer</h1>
      <p class="subtitle">ITPEC / IPA Japan &middot; Click answers, learn instantly</p>
    </div>

    ${inProgressHtml}

    ${EXAMS.map(e => {
        const d = examData(e.id);
        const full = d.attempts.filter(a => a.mode === 'full');
        const best = full.length ? Math.max(...full.map(a => a.correct)) : null;
        const last = d.attempts.at(-1);
        const pct = best != null ? Math.round(best / e.questions.length * 100) : null;
        const statusBadge = d.missed.length
          ? `<span class="badge bad">⚠ ${d.missed.length} to master</span>`
          : full.length ? `<span class="badge ok">✓ All mastered</span>` : `<span class="badge">Not started</span>`;
        return `
      <div class="card">
        <div class="exam-title">${esc(e.title)}</div>
        <div class="exam-meta">
          <span>${e.questions.length} questions</span>
          ${best != null ? `<span class="dot">·</span><span>${pct}% best</span>` : ''}
          ${last ? `<span class="dot">·</span><span>Last: ${last.correct}/${last.total}</span>` : ''}
          ${statusBadge}
        </div>
        <div class="btn-row">
          <button class="pri" onclick="start('${e.id}','full')">▶ Start full exam</button>
          <button ${d.missed.length ? '' : 'disabled'} onclick="start('${e.id}','retry')">Retry missed (${d.missed.length})</button>
          <button ${d.attempts.length ? '' : 'disabled'} onclick="showHistory('${e.id}')">History</button>
        </div>
      </div>`;
      }).join('')}

    <hr class="div">
    <div class="data-row" style="justify-content:space-between">
      <div style="font-size:.82rem;color:var(--mut)">
        Active Key: <b>${esc(currentKey)}</b> &middot; <a href="javascript:void(0)" onclick="openSessionModal()" style="color:var(--pri);font-weight:600">Switch session</a>
      </div>
      <div class="btn-row">
        <button class="ghost sm" onclick="backup()">Export file</button>
        <label class="file-label sm" for="restore-file">Import file</label>
        <input type="file" id="restore-file" accept=".json" onchange="restore(this)">
      </div>
    </div>`;
    }

    // ── Exam Logic ─────────────────────────────────────────────────────────────
    function start(id, mode) {
      if (sessionData?.inProgress && sessionData.inProgress.examId === id) {
        if (!confirm('You already have an exam in progress for this exam. Do you want to overwrite it and start from Question 1?')) {
          resumeExam();
          return;
        }
      }
      const e = EXAMS.find(x => x.id === id), d = examData(id);
      const list = mode === 'retry' ? e.questions.filter(q => d.missed.includes(q.n)) : [...e.questions];
      S = { id, mode, list, i: 0, answers: {}, showPage: false };
      saveCurrentExamProgress();
      show();
    }

    function resumeExam() {
      const inProg = sessionData?.inProgress;
      if (!inProg) return;
      const e = EXAMS.find(x => x.id === inProg.examId);
      if (!e) return;
      const d = examData(inProg.examId);
      const list = inProg.mode === 'retry' ? e.questions.filter(q => d.missed.includes(q.n)) : [...e.questions];
      S = {
        id: inProg.examId,
        mode: inProg.mode,
        list,
        i: Math.min(inProg.i || 0, list.length - 1),
        answers: inProg.answers || {},
        showPage: inProg.showPage || false
      };
      show();
    }

    function discardInProgress() {
      if (confirm('Discard this in-progress exam?')) {
        if (sessionData) {
          sessionData.inProgress = null;
          saveSessionData();
        }
        home();
      }
    }

    function saveCurrentExamProgress() {
      if (!S || !sessionData) return;
      sessionData.inProgress = {
        examId: S.id,
        mode: S.mode,
        i: S.i,
        answers: S.answers,
        listLength: S.list.length,
        showPage: S.showPage,
        updatedAt: Date.now()
      };
      saveSessionData();
    }

    function jumpTo(idx) {
      if (!S || idx < 0 || idx >= S.list.length) return;
      S.i = idx;
      S.showPage = false;
      saveCurrentExamProgress();
      toggleSidebar(false);
      show();
    }

    // ── Build Progress Dashboard Markup ────────────────────────────────────────
    function buildProgressDashboard() {
      if (!S) return '';
      const totalQ = S.list.length;
      const answeredKeys = Object.keys(S.answers);
      const answeredCount = answeredKeys.length;
      const pctDone = Math.round((answeredCount / totalQ) * 100);

      // Calculate accuracy & wrong questions
      const wrongList = [];
      let correctCount = 0;

      S.list.forEach((q, idx) => {
        const picked = S.answers[q.n];
        if (picked != null) {
          if (picked === q.answer) {
            correctCount++;
          } else {
            wrongList.push({ qNum: q.n, idx });
          }
        }
      });

      const wrongCount = wrongList.length;
      const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      const projectedScore = Math.round((accuracy / 100) * 1000);

      // Pass / Fail Prediction
      let predClass = 'passing', predStatus = 'ok', predTitle = '🎉 ON TRACK TO PASS', predDesc = '';
      if (answeredCount < 3) {
        predClass = '';
        predStatus = 'warn';
        predTitle = '🎯 IN PROGRESS';
        predDesc = 'Answer at least 3 questions to unlock your pass/fail projection.';
      } else if (accuracy >= 70) {
        predClass = 'passing';
        predStatus = 'ok';
        predTitle = '🎉 ON TRACK TO PASS!';
        predDesc = `Current accuracy: <b>${accuracy}%</b>. Projected score: <b>${projectedScore} / 1000</b> (Passing cutoff: 600 pts / 60%). You're in great shape!`;
      } else if (accuracy >= 60) {
        predClass = 'warning';
        predStatus = 'warn';
        predTitle = '⚖️ PASSING (NEAR CUTOFF)';
        predDesc = `Current accuracy: <b>${accuracy}%</b>. Projected: <b>${projectedScore} / 1000</b>. You are right at the 600-point cutoff—keep focus on wrong items!`;
      } else {
        predClass = 'failing';
        predStatus = 'bad';
        predTitle = '⚠️ CURRENTLY BELOW PASSING';
        predDesc = `Current accuracy: <b>${accuracy}%</b>. Projected: <b>${projectedScore} / 1000</b>. You need <b>600 points (60%)</b> to pass. Review explanations for missed questions!`;
      }

      // Mobile button update
      const mobileStatsBtn = document.getElementById('mobile-stats-btn');
      if (mobileStatsBtn) {
        mobileStatsBtn.style.display = 'inline-flex';
        mobileStatsBtn.innerHTML = answeredCount > 0
          ? `📊 ${correctCount}/${answeredCount} (${accuracy}% · ${accuracy >= 60 ? 'Pass' : 'Review'})`
          : '📊 Stats';
      }

      return `
    <aside id="exam-sidebar" class="exam-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">📊 Live Progress Dashboard</div>
        <button class="mobile-close-btn" onclick="toggleSidebar(false)" title="Close dashboard">✕</button>
      </div>

      <!-- Pass/Fail Status -->
      <div class="dash-card pred-card ${predClass}">
        <div class="pred-status ${predStatus}">${predTitle}</div>
        <div class="pred-score">${answeredCount > 0 ? accuracy + '%' : '--'} <span style="font-size:.9rem;font-weight:600;color:var(--mut)">accuracy</span></div>
        <div class="pred-desc">${predDesc}</div>
      </div>

      <!-- Completion Stats -->
      <div class="dash-card">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:700">
          <span>Completion: ${pctDone}%</span>
          <span style="color:var(--mut)">${answeredCount} / ${totalQ}</span>
        </div>
        <div class="bar" style="margin:8px 0 10px"><div class="bar-fill" style="width:${pctDone}%"></div></div>

        <div class="stats-3col">
          <div class="stat-pill ok">
            <div class="s-num">${correctCount}</div>
            <div class="s-lbl">Correct</div>
          </div>
          <div class="stat-pill bad">
            <div class="s-num">${wrongCount}</div>
            <div class="s-lbl">Wrong</div>
          </div>
          <div class="stat-pill">
            <div class="s-num">${totalQ - answeredCount}</div>
            <div class="s-lbl">Left</div>
          </div>
        </div>
      </div>

      <!-- Wrong Questions Tracker -->
      <div class="dash-card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:.82rem;font-weight:700;color:var(--tx)">❌ Missed Questions (${wrongCount})</span>
          <span style="font-size:.7rem;color:var(--dim)">Click to review</span>
        </div>
        ${wrongList.length === 0
          ? `<div style="font-size:.82rem;color:var(--ok);margin-top:8px;font-weight:600">✓ No mistakes yet! Clean sheet.</div>`
          : `<div class="wrong-list-wrap">
              ${wrongList.map(w => `<span class="chip bad clickable" onclick="jumpTo(${w.idx})" title="Review Question ${w.qNum}">Q${w.qNum} ✗</span>`).join('')}
             </div>`
        }
      </div>

      <!-- 100-Question Map Grid -->
      <div class="dash-card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:.82rem;font-weight:700;color:var(--tx)">Question Map (${totalQ})</span>
          <span style="font-size:.7rem;color:var(--dim)">Tap any Q</span>
        </div>
        <div class="q-grid-wrap">
          ${S.list.map((q, idx) => {
            const picked = S.answers[q.n];
            const isCur = idx === S.i;
            let cls = isCur ? 'current ' : '';
            if (picked != null) {
              cls += (picked === q.answer ? 'ok' : 'bad');
            }
            return `<div class="q-tile ${cls}" onclick="jumpTo(${idx})" title="Go to Question ${q.n}">${q.n}</div>`;
          }).join('')}
        </div>
        <div class="q-legend">
          <span><span class="dot-legend ok"></span> Correct</span>
          <span><span class="dot-legend bad"></span> Wrong</span>
          <span><span class="dot-legend cur"></span> Current</span>
        </div>
      </div>
    </aside>`;
    }

    // ── Show Question & Exam Layout ────────────────────────────────────────────
    function show() {
      app.classList.add('exam-mode');
      topNav.classList.add('exam-nav');

      const q = S.list[S.i], picked = S.answers[q.n], done = picked != null;
      const keys = Object.keys(q.options);
      const pct = ((S.i + (done ? 1 : 0)) / S.list.length * 100).toFixed(1);
      const fig = S.showPage;
      const modeLabel = S.mode === 'retry' ? 'Retry missed' : 'Full exam';

      app.innerHTML = `
    <div class="exam-container">
      <!-- Main Question Column -->
      <div class="exam-main">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <button class="ghost sm" onclick="home()" title="Return to home menu (progress is automatically saved)">← Menu (Saved)</button>
          <span class="badge cached">🔑 ${esc(currentKey)}</span>
        </div>

        <div class="prog-hdr">
          <span class="prog-label">${modeLabel}</span>
          <span class="prog-count">Question ${S.i + 1} / ${S.list.length}</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>

        <div class="card">
          <div class="q-num">Question ${q.n}</div>
          <div class="stem">${esc(q.stem)}</div>
          ${keys.map(k => {
            let cls = done ? (k === q.answer ? 'ok' : (k === picked ? 'bad' : 'neutral')) : '';
            return `<button class="opt ${cls}" ${done ? 'disabled' : ''} onclick="pick('${k}')"><span class="key">${k}</span><span>${esc(q.options[k])}</span></button>`;
          }).join('')}

          <button class="ghost sm" style="margin-top:10px" onclick="S.showPage=!S.showPage;saveCurrentExamProgress();show()">
            ${fig ? '🔼 Hide' : '📄 View'} original exam page
          </button>
          ${fig ? `<img class="pg" src="pages/p-${String(q.page).padStart(2, '0')}.jpg" alt="Exam page ${q.page}">` : ''}

          ${done ? `
            <div class="exp-wrap">
              <div class="result-tag ${picked === q.answer ? 'ok' : 'bad'}">
                ${picked === q.answer ? '✓ Correct!' : '✗ Wrong — Answer is ' + q.answer.toUpperCase()}
              </div>
              <div class="exp-header-row">
                <span style="font-size:.78rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em">Tutor Explanation</span>
                <span id="exp-badge"></span>
              </div>
              <div id="exp" class="exp-loading"><div class="spinner"></div><span>Getting explanation…</span></div>
              <div id="expd" style="margin-top:14px"></div>
            </div>
            <div class="next-row">
              <button class="pri" onclick="next()">${S.i + 1 < S.list.length ? 'Next →' : 'Finish ✓'}</button>
            </div>
            <p class="hint">Press <kbd>Enter</kbd> or <kbd>→</kbd> to continue</p>
          `: `<p class="hint">Press <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> to answer</p>`}
        </div>
      </div>

      <!-- Right Column: Live Progress Dashboard -->
      ${buildProgressDashboard()}
    </div>`;

      if (done) explain(q);
    }

    function pick(k) {
      const q = S.list[S.i];
      if (S.answers[q.n] == null) {
        S.answers[q.n] = k;
        saveCurrentExamProgress();
        show();
      }
    }

    function next() {
      if (S.i + 1 < S.list.length) {
        S.i++;
        S.showPage = false;
        saveCurrentExamProgress();
        show();
      } else {
        finish();
      }
    }

    async function callAI(q, mode) {
      const r = await fetch('/api/explain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          stem: q.stem,
          options: q.options,
          answer: q.answer,
          mode,
          examId: S.id,
          qNum: q.n
        })
      });
      const raw = await r.text();
      let data;
      try { data = JSON.parse(raw); } catch {
        throw new Error(`HTTP ${r.status}: ${raw.slice(0, 80).replace(/\s+/g, ' ')}`);
      }
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data.explanation;
    }

    // ── Explanation Display & Reusability ─────────────────────────────────────
    async function explain(q) {
      const box = document.getElementById('exp');
      const badge = document.getElementById('exp-badge');
      if (!box) return;

      // 1. REUSABILITY: If short explanation exists, display immediately!
      const cached = getCachedExpl(S.id, q.n, 'short');
      if (cached) {
        if (badge) badge.innerHTML = `<span class="badge ok" style="font-size:.72rem">⚡ Cached</span>`;
        renderExp(box, cached);
        detArea(q);
        return;
      }

      // 2. Otherwise generate via AI and store permanently
      try {
        if (badge) badge.innerHTML = `<span class="badge" style="font-size:.72rem">🤖 Generating AI…</span>`;
        const text = await callAI(q, 'short');
        setCachedExpl(S.id, q.n, 'short', text);

        const b = document.getElementById('exp');
        const bd = document.getElementById('exp-badge');
        if (b && S && S.list[S.i].n === q.n) {
          if (bd) bd.innerHTML = `<span class="badge ok" style="font-size:.72rem">⚡ Saved</span>`;
          renderExp(b, text);
          detArea(q);
        }
      } catch (err) {
        const b = document.getElementById('exp');
        if (!b) return;
        b.outerHTML = `
      <div class="api-notice">
        <span>ℹ️</span>
        <span>AI explanation failed: <b>${esc(err.message)}</b> <button class="sm" onclick="show()">Retry</button></span>
      </div>
      <div class="exp" style="margin-top:10px">${esc(buildFallback(q))}</div>`;
      }
    }

    function detArea(q) {
      const el = document.getElementById('expd');
      if (!el) return;

      // REUSABILITY: If detailed explanation exists, render it immediately!
      const cached = getCachedExpl(S.id, q.n, 'detailed');
      if (cached) {
        const wrap = document.createElement('div');
        wrap.innerHTML = `
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
            <span class="badge cached">✨ Detailed explanation (like I'm 5)</span>
            <span class="badge ok" style="font-size:.72rem">⚡ Cached</span>
          </div>`;
        const d = document.createElement('div');
        renderExp(d, cached);
        wrap.appendChild(d);
        el.innerHTML = '';
        el.appendChild(wrap);
        return;
      }

      el.innerHTML = `<button class="ghost" onclick="detailed()">✨ Detailed explanation (like I'm 5)</button>`;
    }

    async function detailed() {
      const q = S.list[S.i], el = document.getElementById('expd');
      if (!el) return;
      el.innerHTML = `<div class="exp-loading"><div class="spinner"></div><span>Writing detailed explanation…</span></div>`;
      try {
        const text = await callAI(q, 'detailed');
        setCachedExpl(S.id, q.n, 'detailed', text);
        if (S && S.list[S.i].n === q.n) {
          detArea(q);
        }
      } catch (err) {
        const e2 = document.getElementById('expd');
        if (e2) e2.innerHTML = `<div class="api-notice"><span>ℹ️</span><span>Detailed explanation failed: <b>${esc(err.message)}</b> <button class="sm" onclick="detailed()">Retry</button></span></div>`;
      }
    }

    function renderExp(el, text) {
      el.className = 'exp';
      el.innerHTML = esc(text).split(/\n{2,}|\n(?=## )/).map(p => p.trim()).filter(Boolean).map(p => {
        p = p.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
        return p.startsWith('## ')
          ? '<h4>' + p.slice(3).split('\n')[0] + '</h4>' + (p.split('\n').slice(1).join('\n').trim() ? '<p>' + p.split('\n').slice(1).join('<br>') + '</p>' : '')
          : '<p>' + p.replace(/\n/g, '<br>') + '</p>';
      }).join('');
    }

    function buildFallback(q) {
      const ans = q.answer, ansText = q.options[ans] || '';
      const wrongs = Object.entries(q.options).filter(([k]) => k !== ans).map(([k, v]) => `${k.toUpperCase()}) ${v}`).join('\n');
      return `Correct: ${ans.toUpperCase()}) ${ansText}\n\nOther options:\n${wrongs}\n\n(Full AI explanation available when deployed with GEMINI_API_KEY.)`;
    }

    // ── Finish Exam ────────────────────────────────────────────────────────────
    function finish() {
      app.classList.remove('exam-mode');
      topNav.classList.remove('exam-nav');
      document.getElementById('mobile-stats-btn').style.display = 'none';
      toggleSidebar(false);

      const d = examData(S.id);
      const wrong = S.list.filter(q => S.answers[q.n] !== q.answer).map(q => q.n);
      const total = S.list.length, correct = total - wrong.length;
      const pct = Math.round(correct / total * 100), perfect = wrong.length === 0;

      d.attempts.push({ t: Date.now(), mode: S.mode, total, correct, wrong });
      d.missed = S.mode === 'full' ? wrong : d.missed.filter(n => wrong.includes(n));

      if (sessionData) {
        sessionData.inProgress = null;
      }
      saveSessionData();

      const id = S.id; S = null;
      app.innerHTML = `
    <div class="card score-card" style="animation:fadeUp .4s ease both">
      <div class="score-emoji">${perfect ? '🎉' : pct >= 70 ? '💪' : '📖'}</div>
      <div class="score-num">${correct}<span class="slash">/${total}</span></div>
      <div class="score-pct">${pct}% &middot; ${perfect ? 'Perfect score!' : pct >= 70 ? 'Good job!' : 'Keep studying!'}</div>
      ${wrong.length ? `<p style="font-size:.88rem;color:var(--mut);margin-bottom:8px">Missed questions:</p><div class="chips">${wrong.map(n => `<span class="chip bad">Q${n}</span>`).join('')}</div>` : ''}
      <div class="btn-row" style="justify-content:center">
        ${wrong.length ? `<button class="pri" onclick="start('${id}','retry')">Retry ${wrong.length} missed</button>` : ''}
        <button onclick="home()">← Home</button>
      </div>
    </div>`;
    }

    function showHistory(id) {
      app.classList.remove('exam-mode');
      topNav.classList.remove('exam-nav');
      document.getElementById('mobile-stats-btn').style.display = 'none';

      const exam = EXAMS.find(x => x.id === id), d = examData(id);
      app.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <button class="ghost" onclick="home()">← Back</button>
      <h1 style="font-size:1.2rem;margin:0">History</h1>
    </div>
    <p style="font-size:.85rem;color:var(--mut);margin-bottom:14px">${esc(exam?.title || '')} &middot; <span class="badge cached">🔑 ${esc(currentKey)}</span></p>
    ${d.attempts.length === 0
          ? `<div class="card" style="color:var(--mut);text-align:center;padding:40px">No attempts yet in this session</div>`
          : d.attempts.slice().reverse().map(a => `
        <div class="card">
          <div class="hist-score">${a.correct}/${a.total} <span style="color:var(--mut);font-weight:400;font-size:.9rem">(${Math.round(a.correct / a.total * 100)}%)</span></div>
          <div class="hist-meta">${fmt(a.t)} &middot; <span class="badge">${a.mode}</span></div>
          ${a.wrong?.length ? `<div class="hist-missed">Missed: ${a.wrong.map(n => 'Q' + n).join(', ')}</div>` : `<div style="font-size:.8rem;color:var(--ok)">Perfect ✓</div>`}
        </div>`).join('')}`;
    }

    // ── Backup & Restore ───────────────────────────────────────────────────────
    function backup() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(sessionData || {})], { type: 'application/json' }));
      a.download = `itpassport-session-${currentKey || 'backup'}.json`;
      a.click();
    }
    function restore(el) {
      const f = el.files[0]; if (!f) return;
      f.text().then(t => {
        try {
          const parsed = JSON.parse(t);
          if (parsed && typeof parsed === 'object') {
            sessionData = parsed;
            if (parsed.key) currentKey = parsed.key;
            saveSessionData();
            home();
          }
        } catch { alert('Invalid backup file'); }
      });
    }
  </script>
</body>
